{% extends "base.html" %}
{% block content %}
<h2>Top 20 Most Habitable Planets</h2>
<table class="table table-dark table-striped mt-3">
  <tr><th>#</th><th>Name</th><th>Radius</th><th>Temp (K)</th><th>Score</th></tr>
  {% for p in planets %}
  <tr>
    <td>{{ loop.index }}</td>
        <td><a class="text-info" href="{{ url_for('planet_detail', planet_id=p.id) }}">{{ p.name }}</a></td>
    <td>{{ p.radius_earth|round(2) }}</td>
    <td>{{ p.temperature|round(0) }}</td>
    <td>{{ p.habitability_score }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
