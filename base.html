<!DOCTYPE html>
<html>
<head>
  <title>Exoplanet Explorer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark bg-black px-3">
    <a class="navbar-brand" href="/planets">🚀 Exoplanet Explorer</a>
    <div>
      <a class="text-light me-3" href="/planets">All Planets</a>
      <a class="text-light me-3" href="/top">Top Habitable</a>
            <a class="text-light me-3" href="/charts">Charts</a>
      {% if current_user %}
        <a class="text-light me-3" href="/favorites">My Favorites</a>
        <span class="text-info me-3">Hi, {{ current_user }}</span>
        <a class="text-light" href="/logout">Logout</a>
      {% else %}
        <a class="text-light me-3" href="/login">Login</a>
        <a class="text-light" href="/register">Sign up</a>
      {% endif %}
    </div>
  </nav>
  <div class="container py-4">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="alert alert-info">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
